name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check:content
      # build の最後の段 (scripts/og-images.mjs) がページごとの共有の画像を Chromium で撮るので、build の前に入れる
      - run: npx playwright install --with-deps chromium
      # tests/meta.test.ts の後半は dist (書き出したページ) を見るので、build のあとに走らせる
      - run: npm run build
      - run: npm test

      # 通しの検査 (npm run e2e と同じ中身)。dist は上で組み立てたものを使う
      - run: node scripts/e2e.mjs

      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
