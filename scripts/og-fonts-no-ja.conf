<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- 日本語の書体が無い機械の代わり (DejaVu だけを見せる)。共有の画像が、機械の書体に頼らず同梱の書体だけで描けることを
     確かめるために、FONTCONFIG_FILE にこのファイルを渡して scripts/og-images.mjs を走らせる (.github/workflows/deploy.yml) -->
<fontconfig>
  <dir>/usr/share/fonts/truetype/dejavu</dir>
  <cachedir>~/.cache/fontconfig-og-no-ja</cachedir>
</fontconfig>
